<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="10" y="10" width="180" height="60" rx="15" ry="15" 
        fill="url(#gradient)" opacity="0.1"/>
  <!-- 主要文字 -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-size="32" 
        font-weight="bold" text-anchor="middle" fill="url(#gradient)">
    Flowm
  </text>
  <!-- 装饰元素 - 小圆点 -->
  <circle cx="30" cy="30" r="3" fill="#667eea" opacity="0.6"/>
  <circle cx="170" cy="50" r="2" fill="#764ba2" opacity="0.6"/>
  <circle cx="40" cy="55" r="2" fill="#667eea" opacity="0.4"/>
</svg>